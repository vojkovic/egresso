[package]
name = "egresso"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rotate outbound source IPs from a prefix pool via cgroup BPF"

[dependencies]
aya = { version = "0.14", default-features = false }
ipnet = "2"
libc = "0.2"
socket2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
